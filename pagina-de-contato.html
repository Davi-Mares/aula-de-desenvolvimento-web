<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página de contatos </title>
  <link rel="stylesheet" href="css/sistema-solar.css">
  
</head>
<body>

  <header>
    <h1>Contato & Créditos</h1>
  </header>

  <main class="page-panel">
    <h2>📚 Fontes de Informação</h2>
    <ul>
      <li>Wikipedia - Enciclopédia online</li>
    </ul>

    <h2>🖼️ Fontes das Imagens</h2>
    <ul>
      <li>Google Imagens</li>
    </ul>

    <h2 id="contato">📞 Fale comigo</h2>
    <form class="formulario-contato" action="#contato" method="post">
      <div class="campo-formulario">
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" required pattern="[A-Za-zÀ-ÿ ]{3,}" title="Informe pelo menos 3 letras.">
      </div>

      <div class="campo-formulario">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required>
      </div>

      <div class="campo-formulario">
        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="tel" required pattern="\(?[0-9]{2}\)?[ ]?[0-9]{4,5}-?[0-9]{4}" title="Informe um telefone válido.">
      </div>

      <div class="campo-formulario">
        <label for="data">Data do contato</label>
        <input id="data" name="data" type="date" required>
      </div>

      <div class="campo-formulario">
        <label for="assunto">Assunto</label>
        <select id="assunto" name="assunto" required>
          <option value="" selected disabled>Selecione uma opção</option>
          <option value="duvida">Dúvida sobre astronomia</option>
          <option value="sugestao">Sugestão para o site</option>
          <option value="feedback">Feedback</option>
        </select>
      </div>

      <fieldset class="campo-formulario">
        <legend>Como prefere receber a resposta?</legend>
        <label><input type="radio" name="preferencia" value="email" required> E-mail</label>
        <label><input type="radio" name="preferencia" value="telefone"> Telefone</label>
      </fieldset>

      <div class="campo-formulario">
        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
      </div>

      <label class="aceite"><input type="checkbox" name="aceite" required> Aceito o envio desta mensagem.</label>
      <button type="submit">Enviar mensagem</button>
    </form>

    <a href="index.html" class="voltar">⬅️ Voltar para a Página Inicial</a>
  </main>

  <script src="js/app.js"></script>

</body>
</html>
